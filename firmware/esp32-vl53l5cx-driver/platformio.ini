[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 460800
build_flags = 
    -D LOG_LEVEL=2
    -D CONFIG_VL53L5CX_8X8
lib_deps = 
    stm32duino/STM32duino VL53L5CX @ ^1.1.0

[env:native]
platform = native
test_build_src = true
build_flags = 
    -D MOCK_MODE_ONLY
    -D CONFIG_VL53L5CX_8X8
    -std=c++11
